services:
  traefik:
    image: docker.io/library/traefik:v3
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email={{ pillar['n8n']['ssl_email'] }}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER={{ pillar['n8n']['postgres_user'] }}
      - POSTGRES_PASSWORD={{ pillar['n8n']['postgres_password'] }}
      - POSTGRES_DB={{ pillar['n8n']['postgres_db'] }}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ pillar['n8n']['postgres_user'] }}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`{{ pillar['n8n']['subdomain'] }}.{{ pillar['n8n']['domain'] }}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost={{ pillar['n8n']['domain'] }}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_HOST={{ pillar['n8n']['subdomain'] }}.{{ pillar['n8n']['domain'] }}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://{{ pillar['n8n']['subdomain'] }}.{{ pillar['n8n']['domain'] }}/
      - GENERIC_TIMEZONE={{ pillar['n8n']['timezone'] }}
      - TZ={{ pillar['n8n']['timezone'] }}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE={{ pillar['n8n']['postgres_db'] }}
      - DB_POSTGRESDB_USER={{ pillar['n8n']['postgres_user'] }}
      - DB_POSTGRESDB_PASSWORD={{ pillar['n8n']['postgres_password'] }}
      - N8N_ENCRYPTION_KEY={{ pillar['n8n']['encryption_key'] }}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
  traefik_data:
  postgres_data:
